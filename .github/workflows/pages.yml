name: Validate website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Cloudflare Pages builds and serves every site from main (brianrenshaw-app,
  # decks-photo-app, ingest-photo-app, nearabout-app). This job only validates.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_site.py
      - run: python3 scripts/build_decks_site.py
      - run: python3 scripts/build_ingest_site.py
      - run: python3 scripts/build_nearabout_site.py
      - run: python3 scripts/build_portfolio_site.py
      - run: python3 scripts/check_ingest_screenshots.py
      - run: node scripts/check_ingest_interactions.cjs
